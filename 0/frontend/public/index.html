<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Mail + Threat Engine</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    
    <div class="app-container">
        <!-- 1. Minimal App Navigation -->
        <nav class="app-nav">
            <div class="nav-logo">
                <i class="fas fa-layer-group"></i>
            </div>
            <div class="nav-items">
                <a href="#" class="active"><i class="fas fa-inbox"></i></a>
                <a href="#"><i class="far fa-paper-plane"></i></a>
                <a href="#"><i class="far fa-bookmark"></i></a>
                <a href="#"><i class="far fa-folder"></i></a>
            </div>
            <div class="nav-bottom">
                <a href="#"><i class="fas fa-cog"></i></a>
                <div class="avatar">JS</div>
            </div>
        </nav>

        <!-- 2. Email List Column -->
        <aside class="inbox-panel">
            <div class="inbox-header">
                <h2>Inbox</h2>
                <button class="icon-btn"><i class="fas fa-edit"></i></button>
            </div>
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" placeholder="Search emails...">
            </div>
            <div class="inbox-list" id="inbox-list"></div>
        </aside>

        <!-- 3. Main Reading Pane -->
        <main class="reading-pane">
            <div id="empty-state" class="empty-state">
                <i class="far fa-envelope-open" style="font-size: 48px; color: #475569; margin-bottom: 16px;"></i>
                <p>Select an email to read</p>
            </div>

            <div id="email-view" class="email-view hidden">
                <div class="reading-toolbar">
                    <div class="toolbar-actions">
                        <button class="icon-btn"><i class="fas fa-reply"></i></button>
                        <button class="icon-btn"><i class="fas fa-trash"></i></button>
                    </div>
                    
                    <div class="integration-banner" id="integration-banner">
                        <div class="banner-info">
                            <i class="fas fa-shield-virus shield-icon"></i>
                            <span>Threat Engine Active</span>
                        </div>
                        <button class="scan-btn" id="btn-analyze-threat">
                            <i class="fas fa-bolt"></i> Scan Email
                        </button>
                    </div>
                </div>

                <div class="email-content-wrapper">
                    <h1 class="email-subject" id="read-subject">Subject</h1>
                    <div class="email-meta">
                        <div class="meta-avatar" id="read-avatar">?</div>
                        <div class="meta-details">
                            <div class="sender-line">
                                <strong id="read-sender-name">Sender</strong>
                                <span class="sender-email" id="read-sender-email">&lt;email&gt;</span>
                            </div>
                            <div class="date-line" id="read-date">Today at 10:45 AM</div>
                        </div>
                    </div>
                    <div class="email-body-content" id="read-body"></div>
                </div>
            </div>
        </main>

        <!-- 4. Simplified Threat Sidebar -->
        <aside class="threat-sidebar" id="threat-sidebar">
            <div class="sidebar-header">
                <h3><i class="fas fa-radar"></i> Intelligence Report</h3>
                <button class="icon-btn" id="btn-close-threat"><i class="fas fa-times"></i></button>
            </div>
            
            <div class="sidebar-scroll-content" id="results-section">
                <!-- Top Summary (Very Clean) -->
                <div class="verdict-card">
                    <div class="verdict-main">
                        <h1 id="score-value">0</h1>
                        <span class="score-label">/ 100</span>
                    </div>
                    <h2 id="risk-level-badge">CLEAN</h2>
                    <p id="verdict-text" class="verdict-subtext">Awaiting Analysis...</p>
                </div>

                <!-- Clean Map View -->
                <div class="simple-card">
                    <h4>Routing Geography</h4>
                    <div id="map-container"></div>
                </div>

                <!-- Auth Status -->
                <div class="simple-card">
                    <h4>Authentication</h4>
                    <div class="auth-row" id="auth-pills">
                        <!-- Populated by JS -->
                    </div>
                    <div id="domain-alignment" class="align-note"></div>
                </div>

                <!-- Key Findings -->
                <div class="simple-card">
                    <h4>Key Findings</h4>
                    <div class="findings-list" id="indicators-list"></div>
                </div>
            </div>
        </aside>
    </div>

    <div id="loading-spinner" class="spinner-overlay hidden">
        <div class="spinner"></div><p>Scanning payload...</p>
    </div>
    <div id="toast" class="toast hidden"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
